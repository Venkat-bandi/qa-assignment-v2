{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-10">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 mb-4">
                <span class="text-3xl">🔐</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-500 mt-2">Sign in to continue shopping</p>
        </div>

        {% if success %}
        <div id="login-success" class="bg-green-50 border border-green-200 text-green-700 text-sm p-3 rounded-lg mb-6 flex items-center gap-2">
            <span>✅</span> {{ success }}
        </div>
        {% endif %}

        {% if error %}
        <div id="login-error" class="bg-red-50 border border-red-200 text-red-700 text-sm p-3 rounded-lg mb-6 flex items-center gap-2">
            <span>⚠️</span> {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input type="email" name="email" id="email" placeholder="you@example.com"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" required>
            </div>

            <button type="submit" id="login-btn"
                    class="btn-primary w-full text-white font-semibold py-3 rounded-lg">
                Sign In
            </button>
        </form>

        <p class="text-sm text-center text-gray-500 mt-6">
            Don't have an account?
            <a href="/register" class="text-indigo-600 font-medium hover:text-indigo-800">Create one</a>
        </p>

        <div class="mt-6 pt-6 border-t border-gray-100">
            <p class="text-xs text-gray-400 text-center">
                Demo: <span class="font-mono text-gray-500">testuser@shop.com / Test@123</span>
            </p>
        </div>

    </div>
</div>
{% endblock %}
