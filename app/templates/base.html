<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopQA — Modern E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); transition: all 0.2s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgb(102 126 234 / 0.4); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-indigo-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/products" class="flex items-center gap-2 text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                <span class="text-3xl">🛍️</span> ShopQA
            </a>

            {% if user %}
            <div class="hidden md:flex items-center gap-8">
                <a href="/products" class="text-gray-600 hover:text-indigo-600 font-medium transition">Products</a>
                <a href="/cart" class="text-gray-600 hover:text-indigo-600 font-medium transition flex items-center gap-1">
                    <span>🛒</span> Cart
                </a>
                <a href="/orders" id="nav-orders" class="text-gray-600 hover:text-indigo-600 font-medium transition flex items-center gap-1">
                    <span>📦</span> Orders
                </a>
            </div>

            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-indigo-50 rounded-full">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-sm text-indigo-700 font-medium">{{ user }}</span>
                </div>
                <a href="/logout" class="text-sm text-gray-500 hover:text-red-600 font-medium transition">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-20 py-8 text-center text-sm text-gray-400 border-t border-gray-100">
        <p>ShopQA — Demo E-Commerce Platform for Automation Testing</p>
    </footer>

</body>
</html>
