{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-10">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 mb-4">
                <span class="text-3xl">✨</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Create Account</h1>
            <p class="text-gray-500 mt-2">Join ShopQA and start shopping</p>
        </div>

        {% if error %}
        <div id="register-error" class="bg-red-50 border border-red-200 text-red-700 text-sm p-3 rounded-lg mb-6 flex items-center gap-2">
            <span>⚠️</span> {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/register" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input type="email" name="email" id="reg-email" placeholder="you@example.com"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" name="password" id="reg-password" placeholder="Minimum 6 characters"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                <input type="password" name="confirm" id="reg-confirm" placeholder="Re-enter password"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" required>
            </div>

            <button type="submit" id="register-btn"
                    class="btn-primary w-full text-white font-semibold py-3 rounded-lg">
                Create Account
            </button>
        </form>

        <p class="text-sm text-center text-gray-500 mt-6">
            Already have an account?
            <a href="/login" class="text-indigo-600 font-medium hover:text-indigo-800">Sign in</a>
        </p>

    </div>
</div>
{% endblock %}
